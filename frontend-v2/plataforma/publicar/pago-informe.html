<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Estado del informe | Tu Parcela Lista</title><link rel="stylesheet" href="publicar.css"><style>body{background:#f3f7fb}.payment-shell{min-height:100vh;display:grid;place-items:center;padding:24px}.payment-card{width:min(620px,100%);background:#fff;border:1px solid #dce7f1;border-radius:24px;padding:30px;box-shadow:0 20px 60px rgba(8,45,80,.12);text-align:center}.payment-card h1{color:#073a5a}.payment-state{margin:22px 0;padding:18px;border-radius:16px;background:#f4f8fc;font-weight:800}.download-btn{display:inline-flex;padding:13px 18px;border-radius:13px;background:#f5bd22;color:#17324e;font-weight:900;text-decoration:none}.muted{color:#617084;line-height:1.55}</style></head><body><main class="payment-shell"><section class="payment-card"><img src="../../assets/logo-tu-parcela-lista.png" alt="Tu Parcela Lista" width="150"><h1>Estamos verificando tu informe</h1><p class="muted">Flow puede redirigirte antes de que termine la confirmación. Esta pantalla se actualizará automáticamente.</p><div id="state" class="payment-state">Consultando pago…</div><a id="download" class="download-btn" hidden>Descargar informe PDF</a><p id="detail" class="muted"></p><p><a href="index.html">Volver al publicador</a></p></section></main><script src="../../js/core/tpl-data-service.js?v=20260801-2"></script><script>
(async()=>{const state=document.getElementById('state'),detail=document.getElementById('detail'),download=document.getElementById('download');const order=new URLSearchParams(location.search).get('orden');let attempts=0;async function check(){attempts++;try{const data=await window.TPLDataService.getReportOrderStatus(order);const labels={pendiente_pago:'Pago pendiente',pago_iniciado:'Confirmando el pago',pagado:'Pago confirmado. Preparando informe',generando:'Generando tu PDF premium',disponible:'Tu informe está listo',rechazado:'Pago rechazado',cancelado:'Pago cancelado',error:'Se produjo un error'};state.textContent=labels[data.estado]||data.estado;if(data.download_url){download.href=data.download_url;download.hidden=false;detail.textContent='El enlace de descarga estará disponible durante una hora.';return}if(['rechazado','cancelado','error'].includes(data.estado)){detail.textContent='Puedes volver al publicador e iniciar un nuevo pago.';return}if(attempts<30)setTimeout(check,3000);else detail.textContent='La confirmación está tardando más de lo normal. Puedes volver a esta página más tarde.'}catch(error){state.textContent='No pudimos consultar la orden';detail.textContent=error.message||'Revisa la conexión.';}}check();})();
</script></body></html>
